<!doctype html>
<html lang="zh-Hant">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<title>東海龍珠</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;900&display=swap">
<style>
/* Layout: one full-height 3D arcade stage; HUD chips top-left, control deck pinned to the bottom. Single dark look (an arcade at night). */
:root {
  --night: #04060d;
  --panel: rgba(6, 14, 30, .78);
  --line: rgba(120, 200, 255, .35);
  --cyan: #59d0ff;
  --gold: #ffd34d;
  --coral: #ff4d6d;
  --ink: #eaf3ff;
  --ink-dim: #8ea7c6;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink); font-family: var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box; display: flex; flex-direction: column;
}
#app {
  position: relative; flex: 1; min-height: 440px; border-radius: 14px; overflow: hidden;
  background: radial-gradient(90% 70% at 50% 30%, #0b1630, var(--night));
  border: 1px solid var(--line);
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#hud { position: absolute; top: 12px; left: 12px; display: flex; flex-wrap: wrap; gap: 8px; pointer-events: none; max-width: calc(100% - 24px); }
.chip {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 6px 12px; display: flex; flex-direction: column; min-width: 72px; backdrop-filter: blur(6px);
}
.chip span { font-size: 11px; letter-spacing: .12em; color: var(--ink-dim); }
.chip b { font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }
#cCoins { color: var(--cyan); } #cTickets { color: var(--gold); } #cDragons { color: #ff9a3c; }
.deck {
  position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
  background: linear-gradient(transparent, rgba(2,4,10,.85));
}
button {
  font-family: var(--sans); font-weight: 900; font-size: 16px; letter-spacing: .08em; color: var(--ink);
  background: rgba(10, 24, 48, .9); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 16px; min-height: 46px; cursor: pointer;
}
button:hover { border-color: var(--cyan); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
button[aria-pressed="true"] { background: #4a1022; border-color: var(--coral); }
#coinBtn {
  font-size: 22px; padding: 10px 34px; color: #2a1500; border: 0;
  background: linear-gradient(180deg, #fff1a8, var(--gold) 50%, #d99a12);
  box-shadow: 0 4px 0 #7a5208, 0 0 26px rgba(255, 211, 77, .4);
}
#coinBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #7a5208; }
#fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.pop {
  position: absolute; transform: translate(-50%, -50%); font-weight: 900; font-size: 20px; white-space: nowrap;
  text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,.8); animation: rise 1.3s ease-out forwards;
}
@keyframes rise { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -60px; } }
#banner {
  position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%) scale(.6); opacity: 0;
  text-align: center; pointer-events: none; transition: opacity .25s, transform .35s cubic-bezier(.2,1.6,.4,1);
  background: rgba(30, 4, 16, .85); border: 2px solid var(--gold); border-radius: 16px; padding: 12px 28px;
}
#banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#banner h2 { margin: 0; font-size: clamp(30px, 6vw, 52px); font-weight: 900; color: var(--gold); text-wrap: balance; }
#banner p { margin: 4px 0 0; font-size: 18px; color: var(--ink); }
#hint { position: absolute; top: 12px; right: 12px; font-size: 12px; color: var(--ink-dim); background: var(--panel); border-radius: 8px; padding: 6px 10px; max-width: 220px; line-height: 1.5; }
#err { position: absolute; inset: 0; z-index: 5; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center; padding: 24px; color: var(--ink); background: rgba(4,6,13,.92); }
#err p { margin: 0; max-width: 40ch; line-height: 1.6; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-dim); font-size: 15px; letter-spacing: .1em; pointer-events: none; }
@media (max-width: 560px) { #hint { display: none; } .chip b { font-size: 16px; } #coinBtn { font-size: 19px; padding: 10px 24px; } button { font-size: 14px; padding: 8px 12px; } }
@media (prefers-reduced-motion: reduce) { .pop { animation-duration: .01s; } #banner { transition: none; } }
</style>

<div id="app">
  <canvas id="gl" aria-label="東海龍珠 3D 推珠機台"></canvas>
  <div id="loading">機台啟動中…</div>
  <div id="hud">
    <div class="chip"><span>代幣</span><b id="cCoins">500</b></div>
    <div class="chip"><span>彩票</span><b id="cTickets">0</b></div>
    <div class="chip"><span>檯面龍珠</span><b id="cDragons">0/10</b></div>
  </div>
  <div id="hint">拖曳可轉動視角，滾輪縮放。按空白鍵投幣。</div>
  <div id="fx"></div>
  <div id="banner"><h2 id="bTitle"></h2><p id="bSub"></p></div>
  <div class="deck">
    <button id="coinBtn" type="button">投幣</button>
    <button id="autoBtn" type="button" aria-pressed="false">連續投幣</button>
    <button id="muteBtn" type="button" aria-pressed="false">音效 開</button>
    <button id="camBtn" type="button">回正視角</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script>
(function () {
  function fail(msg) {
    var app = document.getElementById('app');
    if (!app || document.getElementById('err')) return;
    var ld = document.getElementById('loading'); if (ld) ld.remove();
    var d = document.createElement('div'); d.id = 'err';
    var p = document.createElement('p'); p.textContent = msg;
    var b = document.createElement('button'); b.type = 'button'; b.textContent = '重新載入機台';
    b.addEventListener('click', function () { location.reload(); });
    d.appendChild(p); d.appendChild(b); app.appendChild(d);
  }
  window.__fail = fail;
  window.addEventListener('error', function (e) { fail('機台發生錯誤：' + (e.message || '未知錯誤')); });
  if (!window.THREE) fail('3D 引擎沒有載入，請檢查網路後重新載入。');
})();
</script>
<script>
(function () {
'use strict';
if (!window.THREE || !THREE.OrbitControls) return;
const { OrbitControls, RoomEnvironment, RoundedBoxGeometry } = THREE;
const app = document.getElementById('app');
const canvas = document.getElementById('gl');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';

// ================= renderer / scene =================
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  window.__fail('這台裝置的瀏覽器無法開啟 3D 畫面（WebGL），請改用電腦版 Chrome、Edge 或 Safari。');
  return;
}
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
let stopped = false;
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); stopped = true; window.__fail('3D 畫面被瀏覽器暫停了（可能是頁面在背景太久或剛收到更新）。'); });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.physicallyCorrectLights = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060d);
scene.fog = new THREE.Fog(0x04060d, 140, 320);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 600);
const TARGET = new THREE.Vector3(7, 21, 2);
const CAM_DIR = new THREE.Vector3(0, 0.3, 1).normalize();
const controls = new OrbitControls(camera, canvas);
controls.target.copy(TARGET);
controls.enableDamping = true; controls.enablePan = false;
controls.minPolarAngle = 0.75; controls.maxPolarAngle = 1.72;
controls.minAzimuthAngle = -0.7; controls.maxAzimuthAngle = 0.7;
controls.minDistance = 35; controls.maxDistance = 220;


let fitDist = 120;
function resetCamera() {
  camera.position.copy(TARGET).addScaledVector(CAM_DIR, fitDist);
  controls.target.copy(TARGET); controls.update();
}
function resize() {
  const w = app.clientWidth, h = app.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const prev = fitDist;
  fitDist = Math.max(40 / t, 31 / (t * camera.aspect));
  if (!resize.done) { resize.done = true; resetCamera(); }
  else { const off = camera.position.clone().sub(controls.target); off.multiplyScalar(fitDist / prev); camera.position.copy(controls.target).add(off); }
}
new ResizeObserver(resize).observe(app);

// ================= helpers =================
function canvasTex(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
  return { c, g, t };
}
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }
function add(mesh, x = 0, y = 0, z = 0, parent = scene) { mesh.position.set(x, y, z); parent.add(mesh); return mesh; }
function rbox(w, h, d, mat, r = 0.5) { return new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, r), mat); }
function plane(w, h, mat) { return new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); }

// 7-segment digits
const SEG = { '0': 'abcdef', '1': 'bc', '2': 'abged', '3': 'abgcd', '4': 'fgbc', '5': 'afgcd', '6': 'afgedc', '7': 'abc', '8': 'abcdefg', '9': 'abcfgd', '-': 'g', ' ': '' };
function digit(g, ch, x, y, w, h, on) {
  const t = w * 0.2, m = t * 0.15;
  const segs = {
    a: [x + t, y, w - 2 * t, t], d: [x + t, y + h - t, w - 2 * t, t], g: [x + t, y + h / 2 - t / 2, w - 2 * t, t],
    f: [x, y + t, t, h / 2 - t * 1.5], b: [x + w - t, y + t, t, h / 2 - t * 1.5],
    e: [x, y + h / 2 + t / 2, t, h / 2 - t * 1.5], c: [x + w - t, y + h / 2 + t / 2, t, h / 2 - t * 1.5],
  };
  for (const k in segs) {
    const [sx, sy, sw, sh] = segs[k], lit = (SEG[ch] || '').includes(k);
    g.fillStyle = lit ? on : 'rgba(255,40,40,.08)';
    g.shadowColor = on; g.shadowBlur = lit ? w * 0.35 : 0;
    g.fillRect(sx + m, sy + m, sw - 2 * m, sh - 2 * m);
  }
  g.shadowBlur = 0;
}
function led(g, str, x, y, w, h, n, on = '#ff3030') {
  rr(g, x, y, w, h, h * 0.12); g.fillStyle = '#0a0000'; g.fill();
  g.lineWidth = 3; g.strokeStyle = '#3a3f4a'; g.stroke();
  const s = String(str).padStart(n, ' ').slice(-n);
  const pad = h * 0.14, dw = (w - pad * 2) / n, dh = h - pad * 2;
  for (let i = 0; i < n; i++) digit(g, s[i], x + pad + i * dw + dw * 0.1, y + pad, dw * 0.8, dh, on);
}
function pearlIcon(g, x, y, r, kind) {
  const grad = g.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r);
  if (kind === 'dragon') { grad.addColorStop(0, '#ffe2c0'); grad.addColorStop(.4, '#ff8a2a'); grad.addColorStop(1, '#a8360a'); }
  else if (kind === 'pink') { grad.addColorStop(0, '#fff'); grad.addColorStop(.4, '#ff9ccf'); grad.addColorStop(1, '#b0306e'); }
  else { grad.addColorStop(0, '#fff'); grad.addColorStop(.6, '#e9e6f2'); grad.addColorStop(1, '#9a94b2'); }
  g.fillStyle = grad; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
}
function ticketIcon(g, x, y, s) {
  g.save(); g.translate(x, y); g.rotate(-0.15);
  rr(g, -s, -s * 0.55, s * 2, s * 1.1, s * 0.15); g.fillStyle = '#ffcf3a'; g.fill();
  g.strokeStyle = '#a86a00'; g.lineWidth = s * 0.1; g.stroke();
  g.fillStyle = '#a86a00'; g.font = `900 ${s * 0.6}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('票', 0, 2);
  g.restore();
}
function bubbles(g, w, h, n, alpha = .25) {
  for (let i = 0; i < n; i++) {
    const x = Math.random() * w, y = Math.random() * h, r = 3 + Math.random() * 14;
    g.strokeStyle = `rgba(200,240,255,${alpha})`; g.lineWidth = 2; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke();
    g.fillStyle = `rgba(255,255,255,${alpha * .8})`; g.beginPath(); g.arc(x - r * .35, y - r * .35, r * .25, 0, Math.PI * 2); g.fill();
  }
}

// ================= materials =================
const M = {
  body: new THREE.MeshPhysicalMaterial({ color: 0xdfe4ec, roughness: .4, clearcoat: .6, clearcoatRoughness: .25, envMapIntensity: .35 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xe6ecf3, metalness: 1, roughness: .16 }),
  darkChrome: new THREE.MeshStandardMaterial({ color: 0x5d6a7a, metalness: .9, roughness: .3 }),
  black: new THREE.MeshStandardMaterial({ color: 0x07090f, roughness: .6 }),
  floor: new THREE.MeshStandardMaterial({ color: 0x0b0f1a, roughness: .35, metalness: .3 }),
  acrylic: new THREE.MeshPhysicalMaterial({ color: 0xcfefff, roughness: .05, transparent: true, opacity: .16, clearcoat: 1, depthWrite: false }),
  led: new THREE.MeshBasicMaterial({ color: new THREE.Color(0.5, 1.6, 3.2), toneMapped: false }),
  ledWarm: new THREE.MeshBasicMaterial({ color: new THREE.Color(3, 2.2, .8), toneMapped: false }),
  pearl: new THREE.MeshStandardMaterial({ color: 0xf6f3ee, roughness: .14, metalness: .05, envMapIntensity: 1.1 }),
  dragon: new THREE.MeshStandardMaterial({ color: 0xff6c12, roughness: .1, metalness: .05, emissive: 0x6a1c00, emissiveIntensity: .55, envMapIntensity: 1.2 }),
};

// ================= lights =================
scene.add(new THREE.HemisphereLight(0x9fc4ff, 0x10121c, 0.25));
const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(12, 70, 55); key.target.position.set(4, 0, 2);
key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left: -32, right: 36, top: 40, bottom: -30, near: 10, far: 160 });
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03;
scene.add(key, key.target);
const boardLight = new THREE.PointLight(0x4fb6ff, 40, 70, 1.6); boardLight.position.set(0, 26, 4); scene.add(boardLight);
const tableLight = new THREE.PointLight(0xbfe6ff, 25, 60, 1.6); tableLight.position.set(0, 14, 12); scene.add(tableLight);
const lampLight = new THREE.PointLight(0xff3050, 40, 50, 1.6); lampLight.position.set(-13, 59, 28); scene.add(lampLight);
const discLight = new THREE.SpotLight(0xffffff, 120, 50, 0.6, 0.5, 1.4); discLight.position.set(27, 20, 16); discLight.target.position.set(27, -6.5, 9); scene.add(discLight, discLight.target);

// ================= environment: floor + neighbours =================
const floor = add(new THREE.Mesh(new THREE.PlaneGeometry(600, 300), M.floor), 0, -14, 40);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
function neighbour(x) {
  const g = new THREE.Group();
  add(rbox(58, 80, 40, M.body, .8), 0, 26, 4, g);
  const pm = new THREE.MeshBasicMaterial({ color: new THREE.Color(.08, .25, .6), toneMapped: false });
  add(plane(50, 48, pm), 0, 24, 24.2, g);
  add(new THREE.Mesh(new THREE.CircleGeometry(4.5, 32), new THREE.MeshBasicMaterial({ color: new THREE.Color(x < 0 ? 0.3 : 2.5, x < 0 ? 2.5 : .3, .4), toneMapped: false })), -20, 60, 24.3, g);
  g.position.x = x; scene.add(g);
}
neighbour(-62); neighbour(76);
for (let i = 0; i < 14; i++) {
  const s = new THREE.Mesh(new THREE.SphereGeometry(1.2, 12, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL(Math.random(), 1, .6).multiplyScalar(2.5), toneMapped: false }));
  add(s, -160 + i * 26, 90 + Math.random() * 20, -120);
}

// ================= cabinet =================
// world units ≈ cm. Table surface y=0, x∈[-18,18], z∈[-12,18]. Right column x∈[20,34].
add(rbox(42, 9, 40, M.body), -1, -9.5, 4);              // left base
add(rbox(16, 7, 40, M.body), 27, -10.5, 4);             // right base
add(rbox(4, 66, 40, M.body), -20, 18, 4);               // left pillar
add(rbox(2.4, 66, 40, M.body), 19, 18, 4);              // partition
add(rbox(3, 66, 40, M.body), 35, 18, 4);                // right pillar
add(rbox(60, 3, 40, M.body), 7, 51.5, 4);               // roof
add(rbox(60, 66, 2, M.body), 7, 18, -16);               // back
for (const [x, mat] of [[-17.9, M.led], [18.0, M.led], [20.4, M.led], [33.6, M.led]]) {
  add(new THREE.Mesh(new THREE.CylinderGeometry(.28, .28, 50, 8), mat), x, 23, 21.5);
}
const strip = add(new THREE.Mesh(new THREE.BoxGeometry(58, .4, .4), M.led), 7, 49.6, 23.8);

// table slab & surface
const tableTex = canvasTex(512, 512);
{
  const g = tableTex.g, gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#0d4c86'); gr.addColorStop(1, '#1a77b8'); g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 3;
  for (let row = 0; row < 14; row++) for (let col = -1; col < 10; col++) {
    const x = col * 56 + (row % 2) * 28, y = row * 40 + 30;
    for (let k = 1; k <= 3; k++) { g.beginPath(); g.arc(x, y, k * 9, Math.PI, 0); g.stroke(); }
  }
  bubbles(g, 512, 512, 18, .15);
}
const tableMat = new THREE.MeshStandardMaterial({ map: tableTex.t, roughness: .35, metalness: .15 });
const slab = add(new THREE.Mesh(new THREE.BoxGeometry(36, 1, 30), [M.chrome, M.chrome, tableMat, M.chrome, M.chrome, M.chrome]), 0, -0.5, 3);
slab.receiveShadow = true;
add(new THREE.Mesh(new THREE.BoxGeometry(36.6, .5, .7), M.chrome), 0, .05, 18.1);
// trough
add(new THREE.Mesh(new THREE.BoxGeometry(36, .4, 6), M.black), 0, -5, 21);
add(new THREE.Mesh(new THREE.BoxGeometry(36.6, 3.4, .5), M.acrylic), 0, -3.4, 24);
// side glass + front glass
add(new THREE.Mesh(new THREE.BoxGeometry(.3, 40, 32), M.acrylic), -18, 20, 3);
add(new THREE.Mesh(new THREE.BoxGeometry(.3, 40, 32), M.acrylic), 18, 20, 3);

// wiper wall and back board
add(new THREE.Mesh(new THREE.BoxGeometry(36, 2.8, .6), M.darkChrome), 0, 4.6, -13.4);
const boardTex = canvasTex(1024, 1024);
function drawBoard() {
  const g = boardTex.g, w = 1024, h = 1024;
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#3fb6ff'); gr.addColorStop(.55, '#1a5fc4'); gr.addColorStop(1, '#0b2a6e');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 6; i++) {
    const x = 80 + i * 170; const lg = g.createLinearGradient(x, 0, x + 120, h);
    lg.addColorStop(0, 'rgba(255,255,255,.18)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = lg; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 60, 0); g.lineTo(x + 220, h); g.lineTo(x + 80, h); g.fill();
  }
  g.restore();
  bubbles(g, w, h * .8, 40, .3);
  // seaweed & coral silhouettes
  for (let s = 0; s < 9; s++) {
    const x = 40 + s * 120 + (s % 2) * 30;
    g.strokeStyle = s % 3 ? 'rgba(40,180,120,.75)' : 'rgba(150,60,170,.7)'; g.lineWidth = 16; g.lineCap = 'round';
    g.beginPath(); g.moveTo(x, h);
    for (let y = h; y > h - 230 - (s % 3) * 50; y -= 20) g.lineTo(x + Math.sin(y * .03 + s) * 18, y);
    g.stroke();
  }
  // slot exit zone (bottom 15%)
  const sy = h * 0.86;
  g.fillStyle = 'rgba(4,16,48,.55)'; g.fillRect(0, sy, w, h - sy);

function physStep(dt) {

    if (d2 < R * R && d2 > 1e-6) { const d = Math.sqrt(d2), o = (R - d) / 2, nx = dx / d, ny = dy / d; a.x -= nx * o; a.y -= ny * o; c.x += nx * o; c.y += ny * o; }
  }

}

    b.mesh.position.set((b.x - W / 2) * K, (b.h + b.r) * K, -12 + b.y * K);
    if (b.state === 'table' || b.state === 'top') {
      const dx = b.x - b.px, dy = b.y - b.py;
      b.mesh.rotation.x += dy * K / (b.r * K) ; b.mesh.rotation.z -= dx * K / (b.r * K);
    }
  }
  for (const b of boardBalls) b.mesh.position.set(b.x, b.y, BZ);
}
let firstFrame = true;
function frame(now) {
  if (stopped) return;
  try { tick(now); } catch (err) { stopped = true; window.__fail('機台發生錯誤：' + err.message); return; }
  if (firstFrame) { firstFrame = false; const ld = document.getElementById('loading'); if (ld) ld.remove(); }
  requestAnimationFrame(frame);
}
function tick(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  acc += dt;
  const STEP = 1 / 120;
  while (acc >= STEP) { physStep(STEP); boardStep(STEP); acc -= STEP; }
  update(dt);
  syncMeshes();
  controls.update();
  renderer.render(scene, camera);
}

function drawStatic() { drawBoard(); drawMarquee(); drawCard(); drawSlots(); drawParty(); drawRight(); }
drawStatic();
resize();
requestAnimationFrame(frame);
if (document.fonts) {
  Promise.race([
    Promise.all(['900 40px "Noto Sans TC"', '500 40px "Noto Sans TC"'].map(f => document.fonts.load(f, '東海龍珠玩法說明投一枚代幣得顆珍珠經過釘板落到推盤動前進穿獎項口可額外或彩票掉進轉依洞顏色張亮燈累積個入派對時間紅贏超級大本機台上限幣出現已滿藍黃外結束場補充羅'))),
    new Promise(r => setTimeout(r, 4000)),
  ]).then(drawStatic).catch(() => {});
}
})();
